name: Voice test

# Makes short samples of the phrases in voice-test/phrases.json with the Iraqi Azure voices,
# to compare with the app's current voice. Started by hand (Actions → Voice test → Run workflow).
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   AZURE_SPEECH_KEY     – Azure → your Speech resource → Keys and Endpoint → KEY 1
#   AZURE_SPEECH_REGION  – the Location/Region on the same page, for example swedencentral
# The clips are saved on the branch voice-samples, so the site on main doesn't change.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voice-test
  cancel-in-progress: true

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: voice-test
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Make the clips
        run: node voice-test/make.mjs
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      - name: Save them on the voice-samples branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          name="$(git log -1 --format=%an)"; mail="$(git log -1 --format=%ae)"
          cd voice-test/out
          git init -q -b voice-samples
          git add -A
          git -c user.name="$name" -c user.email="$mail" commit -q -m "Voice samples"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" voice-samples

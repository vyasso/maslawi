name: Make audio

# Makes the app's audio with Microsoft Azure's Iraqi voices (Bassel, and Rana for what only a woman
# says about herself), from voice/clips.json. Started by hand: Actions → Make audio → Run workflow.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   AZURE_SPEECH_KEY     – Azure → your Speech resource → Keys and Endpoint → KEY 1
#   AZURE_SPEECH_REGION  – the Location/Region on the same page, for example swedencentral
# The audio is saved on the branch voice-audio (not on main, so the site doesn't change),
# ready to be cut into clips and added to the app.
on:
  workflow_dispatch:
    inputs:
      keys:
        description: "Only these phrases (keys from voice/clips.json, separated by commas). Leave empty for all."
        type: string
        default: ""
      batch:
        description: "Phrases per request (1 = one file per phrase)"
        type: string
        default: "12"

permissions:
  contents: write

concurrency:
  group: make-audio
  cancel-in-progress: true

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: voice
      - name: Make the audio
        run: node voice/make.mjs
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          KEYS: ${{ inputs.keys }}
          BATCH: ${{ inputs.batch }}
      - name: Save it on the voice-audio branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          name="$(git log -1 --format=%an)"; mail="$(git log -1 --format=%ae)"
          cd voice/out
          git init -q -b voice-audio
          git add -A
          git -c user.name="$name" -c user.email="$mail" commit -q -m "Audio"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" voice-audio

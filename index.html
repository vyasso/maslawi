<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Learn the Mosul (Maslawi) Iraqi Arabic dialect with short, fun lessons. No Arabic letters needed.">
<meta name="theme-color" content="#1CB0B5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Maslawi">
<title>Maslawi – learn Mosul Arabic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: phone-width game column — sticky stat bar, winding lesson path, fixed 5-tab bar; full-screen lesson player with a feedback sheet. Bright, chunky, everything pressable. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#3C3C3C; --muted:#777F86; --line:#E5E5E5;
  --primary:#1CB0B5; --primary-deep:#13878B; --primary-soft:#DDF6F6;
  --orange:#FF9A3C; --orange-deep:#D9761C;
  --gold:#FFC800; --gold-deep:#E0A800;
  --blue:#1CA0F0; --blue-deep:#1484C8;
  --purple:#A86CF0; --purple-deep:#8549CC;
  --pink:#E35B9C;
  --good:#58A700; --good-bg:#D7FFB8; --good-btn:#58CC02; --good-deep:#46A302;
  --bad:#EA2B2B; --bad-bg:#FFDFE0; --bad-btn:#FF4B4B; --bad-deep:#D33131;
  --lock:#E5E5E5; --lock-deep:#C9C9C9; --lock-ink:#AFAFAF;
  --heart:#FF4B4B; --gem:#1CA0F0; --flame:#FF9600;
  --display:"Baloo Bhaijaan 2","Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --arabic:"Baloo Bhaijaan 2","Geeza Pro","Noto Naskh Arabic",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131F24; --surface:#131F24; --ink:#F1F7FB; --muted:#8FA3AD; --line:#37464F;
  --primary:#2CC4C9; --primary-deep:#178E92; --primary-soft:#173B3D;
  --good:#79D634; --good-bg:#202F36; --bad:#FF6B6B; --bad-bg:#202F36;
  --lock:#37464F; --lock-deep:#2A363D; --lock-ink:#52656D; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#131F24; --surface:#131F24; --ink:#F1F7FB; --muted:#8FA3AD; --line:#37464F;
  --primary:#2CC4C9; --primary-deep:#178E92; --primary-soft:#173B3D;
  --good:#79D634; --good-bg:#202F36; --bad:#FF6B6B; --bad-bg:#202F36;
  --lock:#37464F; --lock-deep:#2A363D; --lock-ink:#52656D; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:700;font-size:16px;line-height:1.4;margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.ar{font-family:var(--arabic);direction:rtl;unicode-bidi:isolate}
.app{max-width:480px;margin:0 auto;min-height:100%;padding-inline:16px;padding-bottom:100px}

/* chunky 3D button */
.btn{border:0;border-radius:16px;padding:14px 18px;font-family:var(--body);font-weight:900;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--primary);box-shadow:0 4px 0 var(--primary-deep);transition:transform .06s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:none}
.btn:disabled{background:var(--lock);color:var(--lock-ink);box-shadow:0 4px 0 var(--lock-deep);cursor:not-allowed}
.btn.good{background:var(--good-btn);box-shadow:0 4px 0 var(--good-deep)}
.btn.bad{background:var(--bad-btn);box-shadow:0 4px 0 var(--bad-deep)}
.btn.gold{background:var(--gold);box-shadow:0 4px 0 var(--gold-deep);color:#5A4300}
.btn.ghost{background:var(--surface);color:var(--muted);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.ghost.blue{color:var(--blue)}
.btn.wide{width:100%}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding-block:12px;border-bottom:2px solid var(--line)}
.course{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:12px;padding:2px 10px;font-family:var(--arabic);font-size:18px;font-weight:800;color:var(--primary)}
.stats{display:flex;gap:16px;font-weight:900;font-variant-numeric:tabular-nums}
.stat{display:flex;align-items:center;gap:5px}
.stat svg{width:24px;height:24px}
.c-flame{color:var(--flame)} .c-gem{color:var(--gem)} .c-heart{color:var(--heart)} .c-xp{color:var(--gold)}
.dim{filter:grayscale(1);opacity:.5}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 8px}
.tab{background:none;border:2px solid transparent;border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tab svg{width:28px;height:28px}
.tab[aria-current="true"]{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}

/* units & path */
.unit{margin-top:18px;border-radius:16px;padding:14px 16px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.unit small{display:block;font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.unit h2{font-family:var(--display);margin:0;font-size:22px;line-height:1.15;text-wrap:balance}
.guide-btn{flex:none;border:2px solid rgba(255,255,255,.45);background:transparent;border-radius:14px;padding:8px 10px;color:#fff;font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.guide-btn svg{width:20px;height:20px}
.u0{background:var(--primary)} .u1{background:var(--purple)} .u2{background:var(--orange)} .u3{background:var(--blue)} .u4{background:var(--pink)} .u5{background:var(--good-btn)}
.unit.locked-u{background:var(--lock);color:var(--lock-ink);box-shadow:0 4px 0 var(--lock-deep)}
.unit.locked-u .guide-btn{color:var(--lock-ink);border-color:var(--lock-deep)}
.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;padding-block:30px 20px}
.node-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node{width:72px;height:66px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;transition:transform .06s}
.node svg{width:34px;height:34px}
.node:active:not(.locked){transform:translateY(6px)}
.ring{position:absolute;inset:-9px;border-radius:50%;border:7px solid var(--line);pointer-events:none}
.ring.on{border-color:var(--gold)}
.start{position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:900;font-size:15px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.start::after{content:"";position:absolute;top:100%;left:50%;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translate(-50%,-6px) rotate(45deg)}
@keyframes bob{50%{transform:translate(-50%,-6px)}}
.node.chest{background:none;box-shadow:none;width:78px;height:66px}
.node.chest svg{width:66px;height:58px}
.node.locked{cursor:not-allowed}
.path-mascot{position:absolute;top:42%;width:110px;pointer-events:none}
.label-done{font-size:12px;color:var(--muted);margin-top:8px;text-transform:uppercase;letter-spacing:.05em}
.proto{font-size:13px;color:var(--muted);border:2px dashed var(--line);border-radius:14px;padding:10px 14px;margin-top:10px;font-weight:600}

/* screens */
h1.screen{font-family:var(--display);font-size:30px;margin:22px 0 2px;line-height:1.1}
.sub{color:var(--muted);margin:0 0 16px;font-weight:600}
.card{border:2px solid var(--line);border-radius:16px;padding:16px;background:var(--surface)}
.stack{display:flex;flex-direction:column;gap:12px}
h2.sec{font-family:var(--display);font-size:22px;margin:14px 0 0}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--primary)}
.word-ar{font-size:34px;font-weight:800;line-height:1.35}
.tr{color:var(--primary);font-weight:800}
.note{font-size:14px;color:var(--muted);margin-top:6px;font-weight:600}
.quest{display:flex;gap:14px;align-items:center}
.quest svg{width:48px;height:48px;flex:none}
.quest .q-body{flex:1;min-width:0}
.quest h3{margin:0 0 6px;font-size:17px}
.pbar{position:relative;height:18px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{position:absolute;inset:0 auto 0 0;background:var(--gold);border-radius:99px;transition:width .4s}
.pbar i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:99px;background:rgba(255,255,255,.45)}
.pbar span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums}
.league-hero{text-align:center;padding-block:8px}
.league-hero svg{width:80px;height:80px}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px}
.lrow.me{background:var(--primary-soft)}
.lrow .rank{width:24px;text-align:center;font-weight:900;font-variant-numeric:tabular-nums}
.lrow .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;flex:none}
.lrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .px{font-variant-numeric:tabular-nums;color:var(--muted)}
.zone{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;text-align:center;padding-block:6px}
.zone.up{color:var(--good)} .zone.down{color:var(--bad)}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sbox{border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.sbox svg{width:26px;height:26px;flex:none}
.sbox b{display:block;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.1}
.sbox span{font-size:13px;color:var(--muted)}
.ach{display:flex;gap:14px;align-items:center;padding-block:12px;border-bottom:2px solid var(--line)}
.ach:last-child{border-bottom:0}
.ach .medal{width:56px;height:62px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none;font-weight:900;font-size:13px;text-align:center;line-height:1}
.ach .medal b{display:block;font-size:20px}
.ach .q-body{flex:1;min-width:0}
.ach h3{margin:0 0 2px;font-size:17px}
.ach p{margin:0 0 6px;color:var(--muted);font-size:14px;font-weight:600}
.review-row{display:flex;align-items:center;gap:12px;padding-block:10px;border-bottom:2px solid var(--line)}
.review-row:last-child{border-bottom:0}
.review-row .w{flex:1;min-width:0}
.review-row .ar{font-size:21px;font-weight:800}
.review-row small{display:block;color:var(--muted);font-weight:600}
.chk{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 10px;font-size:13px;font-weight:900;color:var(--muted);white-space:nowrap}
.chk[aria-pressed="true"]{border-color:var(--good-btn);color:var(--good)}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{width:52px;height:30px;border-radius:99px;border:0;background:var(--lock);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"]::after{left:26px}

/* overlays */
.overlay{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-bg{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:85%;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.l-in{max-width:600px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;padding-inline:16px;min-height:0}
.l-head{display:flex;align-items:center;gap:14px;padding-block:16px 8px;position:relative}
.x{background:none;border:0;padding:2px;color:var(--lock-ink)} .x svg{width:26px;height:26px;display:block}
.bar{position:relative;flex:1;height:18px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--good-btn);border-radius:99px;transition:width .35s cubic-bezier(.3,1.4,.6,1)}
.bar i::after{content:"";position:absolute;left:10px;right:10px;top:4px;height:5px;border-radius:99px;background:rgba(255,255,255,.35)}
.combo{position:absolute;left:50%;top:100%;transform:translateX(-50%);color:var(--flame);font-weight:900;font-size:14px;text-transform:uppercase;letter-spacing:.06em;animation:pop .4s ease-out}
@keyframes pop{0%{transform:translateX(-50%) scale(.6);opacity:0}70%{transform:translateX(-50%) scale(1.15)}}
.l-body{flex:1;overflow-y:auto;padding-block:20px;display:flex;flex-direction:column;gap:20px;min-height:0}
.q{font-family:var(--display);font-size:26px;font-weight:800;margin:0;line-height:1.2;text-wrap:balance}
.newtag{color:var(--purple);font-weight:900;font-size:14px;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.speaker{display:flex;align-items:flex-end;gap:10px}
.mascot{width:96px;height:96px;flex:none}
.bubble{position:relative;border:2px solid var(--line);border-radius:16px;padding:10px 16px;min-width:0;background:var(--surface)}
.bubble::before{content:"";position:absolute;left:-9px;bottom:22px;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble .ar{font-size:30px;font-weight:800;display:block}
.bubble .trs{font-size:14px;color:var(--muted);font-weight:700}
.opts{display:grid;gap:10px}
.opt{background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:12px 16px;text-align:start;font-weight:800;font-size:17px;display:flex;flex-direction:column}
.opt .ar{font-size:26px;font-weight:800;text-align:right}
.opt .trs{font-size:13px;color:var(--muted);font-weight:700}
.opt:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.opt[aria-pressed="true"]{border-color:#84D8FF;background:#DDF4FF;color:#1899D6}
.opt.ok{border-color:#A5ED6E;background:var(--good-bg);color:var(--good)}
.opt.no{border-color:#FFB2B2;background:var(--bad-bg);color:var(--bad)}
.opt[aria-pressed="true"] .trs,.opt.ok .trs,.opt.no .trs{color:inherit;opacity:.8}
.opt:disabled{cursor:default}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pair{background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:12px 8px;font-weight:800;min-height:64px;font-size:16px}
.pair.ar{font-size:24px}
.pair[aria-pressed="true"]{border-color:#84D8FF;background:#DDF4FF;color:#1899D6}
.pair.matched{border-color:var(--line);background:var(--surface);color:var(--lock-ink);border-bottom-width:2px;cursor:default}
.pair.flash{border-color:#A5ED6E;background:var(--good-bg);color:var(--good)}
.pair.wrong{border-color:#FFB2B2;background:var(--bad-bg);color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.answer-line{min-height:120px;background:repeating-linear-gradient(to bottom,transparent 0 56px,var(--line) 56px 58px);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding-top:6px}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;padding:8px 16px;font-family:var(--body);font-size:19px;font-weight:900;min-height:48px}
.tile.used{background:var(--line);color:transparent;border-color:var(--line);pointer-events:none}
.type-in{width:100%;min-height:120px;border:2px solid var(--line);border-radius:16px;background:var(--surface);padding:12px 14px;font:inherit;font-size:18px;color:var(--ink);resize:none}
.type-in:focus{outline:none;border-color:var(--blue)}
.intro-card{text-align:center;align-items:center;display:flex;flex-direction:column;gap:6px;border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;padding:24px 16px}
.intro-card .ar{font-size:54px;font-weight:800;line-height:1.3}
.intro-card .tr{font-size:22px}
.intro-card .en{font-size:20px}

.l-foot{border-top:2px solid var(--line);padding:16px;margin-inline:-16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.l-foot .btn{flex:1;min-width:130px}
.l-foot.ok{background:var(--good-bg);border-color:transparent;animation:up .2s ease-out}
.l-foot.no{background:var(--bad-bg);border-color:transparent;animation:up .2s ease-out}
.fb{display:flex;align-items:center;gap:12px;flex:1 1 100%}
.fb .ic{width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.fb .ic svg{width:32px;height:32px}
.fb h3{margin:0;font-family:var(--display);font-size:22px}
.fb p{margin:0;font-size:16px}
.l-foot.ok .fb{color:var(--good)} .l-foot.no .fb{color:var(--bad)}

.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding-block:20px}
.end h2{font-family:var(--display);font-size:32px;margin:0;color:var(--gold-deep)}
.end .mascot{width:150px;height:150px}
.endstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:420px}
.es{border:2px solid;border-radius:16px;overflow:hidden}
.es span{display:block;color:#fff;font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:4px}
.es b{display:flex;align-items:center;justify-content:center;gap:4px;padding:12px 4px;font-size:20px;font-variant-numeric:tabular-nums;background:var(--surface)}
.es.y{border-color:var(--gold)} .es.y span{background:var(--gold)} .es.y b{color:var(--gold-deep)}
.es.g{border-color:var(--good-btn)} .es.g span{background:var(--good-btn)} .es.g b{color:var(--good)}
.es.b{border-color:var(--blue)} .es.b span{background:var(--blue)} .es.b b{color:var(--blue)}
.bigflame{width:140px;height:140px;color:var(--flame)}
.streaknum{font-family:var(--display);font-size:80px;line-height:1;color:var(--flame);font-weight:800;font-variant-numeric:tabular-nums}
.week{display:flex;gap:6px;justify-content:center;border:2px solid var(--line);border-radius:16px;padding:12px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--muted);width:36px}
.day i{width:28px;height:28px;border-radius:50%;background:var(--line);display:grid;place-items:center}
.day.on i{background:var(--flame)}
.day.on i::after{content:"";width:10px;height:6px;border-left:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.day.today{color:var(--flame)}
/* English-letter phrases */
.say{font-weight:900;color:var(--ink)}
.bubble .say{display:block;font-size:26px;line-height:1.2}
.bubble.row{display:flex;align-items:center;gap:12px}
.intro-card .say{font-size:40px;line-height:1.15;color:var(--primary)}
.opt .say{font-size:20px}
.review-row .say{font-size:18px}
.word-ar.say{font-size:30px;line-height:1.2}
.lrowx{display:flex;align-items:center;gap:14px}
.arsm{display:block;font-family:var(--arabic);direction:rtl;unicode-bidi:isolate;color:var(--muted);font-size:18px;font-weight:700;line-height:1.4}
.intro-card .arsm{font-size:24px}
.pair.sayp{font-size:18px;font-weight:900}

let CUR_A=null;
function speak(k,quiet){
  const src=AUD[k];
  if(!src){ if(!quiet) toast("No audio for this phrase yet."); return; }
  try{ if(CUR_A){CUR_A.pause();} CUR_A=new Audio(src); const p=CUR_A.play(); if(p&&p.catch) p.catch(()=>{ if(!quiet) toast("Tap the speaker again to play."); }); }catch(e){}
}
/* called from inside the Continue/Check tap handlers, so the tap still counts */

let actx;
function tone(seq,type="sine",vol=.16){ if(!S.sound) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const t0=actx.currentTime;

/* confetti */
function confetti(){ if(reduced) return; const c=document.createElement("canvas");c.className="confetti";document.body.appendChild(c);const x=c.getContext("2d");
  const r=()=>{c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);};r();
  const cols=["#1CB0B5","#FFC800","#FF9A3C","#A86CF0","#58CC02","#FF4B4B","#1CA0F0"];
  const P=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,w:6+Math.random()*6,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.random()*cols.length|0]}));
  let f=0;(function tick(){x.clearRect(0,0,innerWidth,innerHeight);P.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore();});if(++f<160)requestAnimationFrame(tick);else c.remove();})();
}

/* ================= LESSON PLAYER ================= */
let L=null;
function openOverlay(){ $("#lesson").hidden=false; document.body.style.overflow="hidden"; }
function closeLesson(){ $("#lesson").hidden=true; $("#lesson").innerHTML=""; document.body.style.overflow=""; L=null; render(); }
function startLesson(i){ if(S.hearts<=0) return noHearts(); L={i,ex:LESSONS[i].ex.slice(),total:LESSONS[i].ex.length,k:0,right:0,wrong:0,combo:0,xp:0,t0:Date.now()}; openOverlay(); step(); }
function startPractice(){
  const pool=learnedWords(); if(pool.length<4) return; const pick=shuffle(pool).slice(0,6);
  const ex=pick.slice(0,5).map((w,j)=>({t:j%2?"mcqR":"mcq",w,pool:shuffle(pool.filter(x=>x!==w)).slice(0,3)}));
  ex.push({t:"match",ws:shuffle(pool).slice(0,4)});
  L={i:-1,practice:true,ex,total:ex.length,k:0,right:0,wrong:0,combo:0,xp:0,t0:Date.now()}; openOverlay(); step();
}
function quitConfirm(){
  sheet(`<div style="text-align:center">${mascot("sad")}<h2 class="sec" style="margin:4px 0">Wait, don't go!</h2><p class="sub" style="margin:0">You'll lose your progress in this lesson.</p></div><button class="btn wide" data-close>Keep learning</button><button class="btn ghost wide" id="endq" style="color:var(--bad)">End session</button>`);
  $("#endq").onclick=()=>{$("#sheet").hidden=true;closeLesson();};
}
function shell(body,foot){
  const pct=Math.round(L.k/L.ex.length*100);
  $("#lesson").innerHTML=`<div class="l-in"><div class="l-head"><button class="x" id="quit" aria-label="Quit lesson">${I.x}</button><div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${Math.max(pct,3)}%"></i></div><span class="stat c-heart">${I.heart}${S.hearts}</span>${L.combo>=3?`<span class="combo">${L.combo} in a row!</span>`:""}</div><div class="l-body">${body}</div><div class="l-foot" id="foot">${foot}</div></div>`;
  $("#quit").onclick=quitConfirm;
}
const footCheck=()=>`<button class="btn ghost" id="skip">Skip</button><button class="btn good" id="check" disabled>Check</button>`;
function verdict(ok,detail,skipped){
  const f=$("#foot"); f.className="l-foot "+(ok?"ok":"no");
  const praise=["Nicely done!","Great job!","Excellent!","Ahsant!","Amazing!"][Math.random()*5|0];
  f.innerHTML=`<div class="fb"><span class="ic" style="color:${ok?"var(--good-btn)":"var(--bad-btn)"}">${ok?I.ok:I.x}</span><div><h3>${ok?praise:"Correct solution:"}</h3>${detail?`<p>${detail}</p>`:""}</div></div><button class="btn ${ok?"good":"bad"} wide" id="next">${ok?"Continue":"Got it"}</button>`;
  if(ok){ L.right++; L.combo++; L.xp+= L.combo>=5?2:1; S.bestCombo=Math.max(S.bestCombo,L.combo); S.q.combo=Math.max(S.q.combo,L.combo); sGood(); }
  else { L.wrong++; L.combo=0; if(!skipped&&!L.practice) S.hearts=Math.max(0,S.hearts-1); sBad(); L.ex.push(L.ex[L.k]); }
  save();
  const nx=$("#next"); nx.focus(); nx.onclick=()=>{ if(S.hearts<=0&&!L.practice) return noHearts(); L.k++; step(); };
}
function noHearts(){
  openOverlay();
  $("#lesson").innerHTML=`<div class="l-in"><div class="end">${mascot("sad")}<h2 style="color:var(--heart)">You ran out of hearts!</h2><p class="sub" style="margin:0">Hearts refill tomorrow. You can also refill now with gems, or practice old words to win one back.</p>
  <button class="btn wide" id="refill" ${S.gems<30?"disabled":""}>Refill for 30 gems (you have ${S.gems})</button>
  <button class="btn ghost wide blue" id="prac">Practice to earn a heart</button>
  <button class="btn ghost wide" id="back">No thanks</button></div></div>`;
  $("#refill").onclick=()=>{S.gems-=30;S.hearts=5;save();closeLesson();};
  $("#prac").onclick=()=>{ if(learnedWords().length>=4){ startPractice(); } else { S.hearts=1; save(); closeLesson(); } };
  $("#back").onclick=closeLesson;
}
function step(){ if(L.k>=L.ex.length) return finish(); const e=L.ex[L.k]; ({intro:exIntro,mcq:exMcq,mcqR:exMcq,reply:exReply,match:exMatch,build:exBuild,type:exType})[e.t](e); }
function wireSkip(){ const s=$("#skip"); if(s) s.onclick=()=>{ document.querySelectorAll(".l-body button,.l-body textarea").forEach(b=>b.disabled=true); verdict(false,skipAnswer(),true); }; }
function skipAnswer(){ const e=L.ex[L.k]; if(e.t==="build") return esc(e.answer.join(" ")); if(e.t==="reply") return esc(W[e.ok].tr); if(e.t==="type") return esc(W[e.w].en); if(e.t==="mcqR") return esc(W[e.w].tr); return esc(W[e.w].en); }

function exIntro(e){
  const w=W[e.w];
  shell(`<span class="newtag">${I.star.replace('fill="#fff"','fill="currentColor" width="18" height="18"')}New phrase</span><div class="intro-card">${lbtn(e.w,true)}<div class="say">${esc(w.tr)}</div>${arSm(e.w)}<div class="en">${esc(w.en)}</div>${w.note?`<div class="note">${esc(w.note)}</div>`:""}</div>`,`<button class="btn wide" id="next">Continue</button>`);
  autoSay(e.w); $("#next").focus(); $("#next").onclick=()=>{sTap();L.k++;step();};
}
function opts(list,fn){return list.map((o,i)=>`<button class="opt" data-i="${i}" aria-pressed="false">${fn(o)}</button>`).join("");}
function wireChoices(onCheck){
  let pick=null; const btns=[...document.querySelectorAll(".opt")];
  btns.forEach(b=>b.onclick=()=>{sTap();btns.forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");pick=+b.dataset.i;$("#check").disabled=false;});
  $("#check").onclick=()=>{btns.forEach(b=>{b.disabled=true;b.setAttribute("aria-pressed","false");});onCheck(pick,btns);};
  wireSkip();
}
function exMcq(e){
  const w=W[e.w], rev=e.t==="mcqR", list=shuffle([e.w,...e.pool]);
  const bub=rev?`<div class="bubble"><span style="font-size:22px;font-weight:800">${esc(w.en)}</span></div>`:`<div class="bubble row">${lbtn(e.w)}<div><span class="say">${esc(w.tr)}</span>${arSm(e.w)}</div></div>`;
  shell(`<h2 class="q">${rev?"How do you say this?":"What does this mean?"}</h2><div class="speaker">${mascot()}${bub}</div><div class="opts">${opts(list,k=>rev?`<span class="say">${esc(W[k].tr)}</span>${arSm(k)}`:esc(W[k].en))}</div>`,footCheck());
  if(!rev) autoSay(e.w);
  wireChoices((p,b)=>{const ok=list[p]===e.w;b[p].classList.add(ok?"ok":"no");b[list.indexOf(e.w)].classList.add("ok");verdict(ok,ok?"":skipAnswer());});
}
function exReply(e){
  const s=W[e.say], list=shuffle(e.opts);
  shell(`<h2 class="q">Pick the right reply</h2><div class="speaker">${mascot("wow")}<div class="bubble row">${lbtn(e.say)}<div><span class="trs">${esc(e.who)}</span><span class="say">${esc(s.tr)}</span>${arSm(e.say)}<span class="trs">${esc(s.en)}</span></div></div></div><div class="opts">${opts(list,k=>`<span class="say">${esc(W[k].tr)}</span>${arSm(k)}`)}</div>`,footCheck());
  autoSay(e.say);
  wireChoices((p,b)=>{const ok=list[p]===e.ok;b[p].classList.add(ok?"ok":"no");b[list.indexOf(e.ok)].classList.add("ok");const a=W[e.ok];verdict(ok,`${esc(a.tr)} · ${esc(a.en)}`);});
}
function exType(e){
  const w=W[e.w];
  shell(`<h2 class="q">Write this in English</h2><div class="speaker">${mascot()}<div class="bubble row">${lbtn(e.w)}<div><span class="say">${esc(w.tr)}</span>${arSm(e.w)}</div></div></div><label for="ans" class="sub" style="margin:0">Your answer</label><textarea id="ans" class="type-in" placeholder="Type in English" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>`,footCheck());
  const t=$("#ans"); t.focus(); t.oninput=()=>{$("#check").disabled=!t.value.trim();};
  t.onkeydown=ev=>{if(ev.key==="Enter"){ev.preventDefault();if(t.value.trim())$("#check").click();}};
  $("#check").onclick=()=>{t.disabled=true;const ok=e.acc.map(norm).includes(norm(t.value));verdict(ok,ok?`Meaning: ${esc(w.en)}`:esc(w.en));};
  wireSkip();
}
function exMatch(e){
  const left=shuffle(e.ws), right=shuffle(e.ws);
  let h=`<h2 class="q">Tap the matching pairs</h2><div class="pairs">`;
  for(let i=0;i<left.length;i++) h+=`<button class="pair sayp" data-k="${left[i]}" data-s="a" aria-pressed="false">${esc(W[left[i]].tr)}</button><button class="pair" data-k="${right[i]}" data-s="e" aria-pressed="false">${esc(W[right[i]].en.replace(/\s*\(.*\)/,""))}</button>`;
  shell(h+`</div>`,`<button class="btn good wide" id="check" disabled>Continue</button>`);
  let sel=null, n=0, slip=false;
  document.querySelectorAll(".pair").forEach(b=>b.onclick=()=>{
    if(b.disabled) return;
    if(!sel||sel.dataset.s===b.dataset.s){ sTap(); if(sel) sel.setAttribute("aria-pressed","false"); sel=b; b.setAttribute("aria-pressed","true"); return; }
    const a=sel; sel=null; a.setAttribute("aria-pressed","false");
    if(a.dataset.k===b.dataset.k){ tone([[880,0,.08]]); [a,b].forEach(x=>{x.classList.add("flash");x.disabled=true;setTimeout(()=>{x.classList.remove("flash");x.classList.add("matched");},350);}); n++;
      if(n===e.ws.length){ L.right++; L.combo++; L.xp+=slip?1:2; S.bestCombo=Math.max(S.bestCombo,L.combo); S.q.combo=Math.max(S.q.combo,L.combo); save(); setTimeout(sGood,300); const c=$("#check"); c.disabled=false; c.focus(); c.onclick=()=>{L.k++;step();}; } }
    else { slip=true; sBad(); [a,b].forEach(x=>x.classList.add("wrong")); setTimeout(()=>[a,b].forEach(x=>x.classList.remove("wrong")),450); }
  });
}
function exBuild(e){
  const tiles=shuffle(e.tiles.map((t,i)=>({t,i}))); let chosen=[];
  shell(`<h2 class="q">Say this in Maslawi</h2><div class="speaker">${mascot()}<div class="bubble"><span style="font-size:22px;font-weight:800">${esc(e.en)}</span></div></div><div class="answer-line" id="line"></div><div class="tiles" id="bank">${tiles.map(x=>`<button class="tile" data-i="${x.i}">${x.t}</button>`).join("")}</div>`,footCheck());
  const line=$("#line"), bank=$("#bank");
  function draw(){ line.innerHTML=chosen.map(i=>`<button class="tile" data-i="${i}">${e.tiles[i]}</button>`).join("");
    bank.querySelectorAll(".tile").forEach(b=>b.classList.toggle("used",chosen.includes(+b.dataset.i)));
    line.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{sTap();chosen=chosen.filter(i=>i!==+b.dataset.i);draw();});
    $("#check").disabled=!chosen.length; }
  bank.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(!chosen.includes(i)){sTap();chosen.push(i);draw();}});
  $("#check").onclick=()=>{ const ok=chosen.map(i=>e.tiles[i]).join(" ")===e.answer.join(" "); document.querySelectorAll(".tile").forEach(b=>b.disabled=true); verdict(ok,ok?"":skipAnswer()); };
  wireSkip();
}

function finish(){
  const acc=Math.round(L.right/Math.max(1,L.right+L.wrong)*100), perfect=L.wrong===0;
  const gained=L.practice?Math.max(5,L.xp):10+L.xp+(perfect?5:0);
  const secs=Math.round((Date.now()-L.t0)/1000), time=Math.floor(secs/60)+":"+String(secs%60).padStart(2,"0");
  const firstToday=S.lastDay!==today();
  S.xp+=gained; S.weekXp+=gained; S.q.xp+=gained; S.lessons++; S.q.lessons++;
  if(L.practice) S.hearts=Math.min(5,S.hearts+1);
  else { S.done[LESSONS[L.i].id]=true; if(perfect) S.perfect++; S.gems+=perfect?5:2; }
  if(firstToday){ S.streak=(S.lastDay===yesterday()?S.streak:0)+1; S.lastDay=today(); S.days=[...new Set([...(S.days||[]),today()])].slice(-14); }
  save(); sWin(); confetti();
  const head=L.practice?"Practice complete!":perfect?"Perfect lesson!":"Lesson complete!";
  $("#lesson").innerHTML=`<div class="l-in"><div class="end">${mascot("happy")}<h2>${head}</h2>${L.practice?'<p class="sub" style="margin:0">You won back a heart.</p>':""}
  <div class="endstats"><div class="es y"><span>Total XP</span><b>${I.bolt.replace("<svg",'<svg width="20" height="20"')}${gained}</b></div><div class="es g"><span>${acc>=90?"Amazing":acc>=70?"Good":"Accuracy"}</span><b>${acc}%</b></div><div class="es b"><span>Quick</span><b>${time}</b></div></div>
  <button class="btn wide" id="cont" style="max-width:420px">Continue</button></div></div>`;
  $("#cont").focus(); $("#cont").onclick=()=>firstToday?streakScreen():closeLesson();
}
function streakScreen(){
  sWin();
  const d=new Date(), mon=new Date(d); mon.setDate(d.getDate()-((d.getDay()+6)%7));
  const days=["Mo","Tu","We","Th","Fr","Sa","Su"].map((n,i)=>{const x=new Date(mon);x.setDate(mon.getDate()+i);const ds=dstr(x);return `<div class="day ${(S.days||[]).includes(ds)?"on":""} ${ds===today()?"today":""}">${n}<i></i></div>`;}).join("");
  $("#lesson").innerHTML=`<div class="l-in"><div class="end"><span class="bigflame">${I.flame.replace("<svg",'<svg width="140" height="140"')}</span><div class="streaknum">${S.streak}</div><h2 style="color:var(--flame)">day streak!</h2><div class="week">${days}</div><p class="sub" style="margin:0;max-width:32ch">Practice every day to keep your streak growing.</p><button class="btn wide" id="cont" style="max-width:420px;background:var(--flame);box-shadow:0 4px 0 var(--orange-deep)">I'm committed</button></div></div>`;
  $("#cont").focus(); $("#cont").onclick=closeLesson;
}

/* ================= ACCOUNTS & CLOUD SYNC (Supabase REST, no library) ================= */
const storeSes=()=>{try{SES?localStorage.setItem(SKEY,JSON.stringify(SES)):localStorage.removeItem(SKEY);}catch(e){}};
const userName=()=>(SES&&SES.user&&SES.user.user_metadata&&SES.user.user_metadata.name)||"";

async function api(path,opt={},auth=true){
  const h=Object.assign({"apikey":SUPABASE_ANON_KEY,"Content-Type":"application/json"},opt.headers||{});
  if(auth&&SES) h.Authorization="Bearer "+SES.access_token;
  const r=await fetch(SUPABASE_URL.replace(/\/$/,"")+path,Object.assign({},opt,{headers:h}));
  const txt=await r.text(); let j=null; try{j=txt?JSON.parse(txt):null;}catch(e){}
  if(!r.ok){ const m=(j&&(j.msg||j.error_description||j.message||j.error))||("Error "+r.status); const err=new Error(m); err.status=r.status; throw err; }
  return j;
}
function setSession(j){ SES={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+((j.expires_in||3600)-60)*1000,user:j.user}; storeSes(); }
async function freshToken(){
  if(!SES) return false;
  if(Date.now()<SES.expires_at) return true;
  try{ setSession(await api("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:JSON.stringify({refresh_token:SES.refresh_token})},false)); return true; }
  catch(e){ if(e.status===400||e.status===401){ SES=null; storeSes(); render(); } return false; }
}
async function signUp(name,email,password){
  const j=await api("/auth/v1/signup",{method:"POST",body:JSON.stringify({email,password,data:{name}})},false);
  if(j&&j.access_token){ setSession(j); await pullAndMerge(); return "in"; }
  return "confirm";
}
async function signIn(email,password){
  setSession(await api("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email,password})},false));
  await pullAndMerge();
}
async function signOut(){
  try{ await pushNow(); await api("/auth/v1/logout",{method:"POST"}); }catch(e){}
  SES=null; storeSes(); syncState="idle"; IS_REVIEWER=false; CHECKS={}; render();
}

/* combine device progress and cloud progress without losing either */
function mergeState(a,b){
  const base=(b.xp||0)>=(a.xp||0)?b:a, r=Object.assign(fresh(),base);
  ["done","chests","checked"].forEach(k=>r[k]=Object.assign({},a[k]||{},b[k]||{}));
  ["xp","perfect","lessons","bestCombo"].forEach(k=>r[k]=Math.max(a[k]||0,b[k]||0));
  const later=(a.lastDay||"")>(b.lastDay||"")?a:(b.lastDay||"")>(a.lastDay||"")?b:null;
  if(later){ r.streak=later.streak; r.lastDay=later.lastDay; } else r.streak=Math.max(a.streak||0,b.streak||0);
  r.days=[...new Set([...(a.days||[]),...(b.days||[])])].sort().slice(-14);
  if(a.week===b.week) r.weekXp=Math.max(a.weekXp||0,b.weekXp||0);
  r.sound=a.sound; r.arabic=a.arabic;
  return r;
}
async function pullAndMerge(){
  if(!CLOUD||!(await freshToken())) return;
  syncState="syncing"; refreshSync();
  try{
    const rows=await api("/rest/v1/progress?select=data&user_id=eq."+SES.user.id);
    if(rows&&rows[0]&&rows[0].data){ S=mergeState(S,rows[0].data); try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
    await pushNow();
  }catch(e){ syncState="error"; refreshSync(); }
  await loadReviewer();
  render();
}
async function pushNow(){
  if(!CLOUD||!SES||!(await freshToken())) return;
  syncState="syncing"; refreshSync();
  try{
    await api("/rest/v1/progress",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({user_id:SES.user.id,data:S,updated_at:new Date().toISOString()})});
    syncState="ok"; lastSync=new Date();
  }catch(e){ syncState="error"; }
  refreshSync();
}
function queueSync(){ if(!CLOUD||!SES) return; clearTimeout(syncTimer); syncTimer=setTimeout(pushNow,1500); }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"&&syncTimer){ clearTimeout(syncTimer); pushNow(); } else if(document.visibilityState==="visible"&&SES) pullAndMerge(); });
function syncText(){ return syncState==="syncing"?"Saving…":syncState==="error"?"Couldn't save. Check your internet.":lastSync?"Saved to your account "+lastSync.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}):"Progress saves to your account"; }
function refreshSync(){ const e=document.getElementById("synctxt"); if(e) e.textContent=syncText(); }

function accountCard(){
  if(!CLOUD) return "";
  if(SES) return `<div class="card acct"><div class="acct-row"><span class="av" style="background:var(--primary)">${esc((userName()||SES.user.email||"?")[0].toUpperCase())}</span><div style="min-width:0;flex:1"><b>${esc(userName()||"Learner")}</b><small>${esc(SES.user.email||"")}</small><small id="synctxt">${esc(syncText())}</small></div></div><button class="btn ghost wide" id="signout">Sign out</button></div>`;
  return `<div class="card acct"><b style="font-size:18px">Save your progress</b><p class="sub" style="margin:4px 0 12px">Create a free account to keep your streak and lessons on every device.</p><button class="btn wide" id="signup">Create account</button><button class="btn ghost wide blue" id="signin" style="margin-top:10px">I already have an account</button></div>`;
}
function wireAccount(){
  const so=$("#signout"); if(so) so.onclick=signOut;
  const su=$("#signup"); if(su) su.onclick=()=>authSheet("up");
  const si=$("#signin"); if(si) si.onclick=()=>authSheet("in");
}
function authSheet(mode){
  const up=mode==="up";
  sheet(`<div style="text-align:center">${mascot("happy")}<h2 class="sec" style="margin:4px 0">${up?"Create your account":"Welcome back"}</h2></div>
  <form id="authf" class="stack" novalidate>
    ${up?`<label class="fld">First name<input id="a-name" autocomplete="given-name" required maxlength="40"></label>`:""}
    <label class="fld">Email<input id="a-email" type="email" autocomplete="email" required></label>
    <label class="fld">Password<input id="a-pass" type="password" autocomplete="${up?"new-password":"current-password"}" required minlength="6"></label>
    <p class="ferr" id="a-err" hidden></p>
    <button class="btn wide" id="a-go" type="submit">${up?"Create account":"Sign in"}</button>
    <button class="btn ghost wide" type="button" id="a-swap">${up?"I already have an account":"Create a new account"}</button>
  </form>`);
  $("#a-swap").onclick=()=>authSheet(up?"in":"up");
  const f=$("#authf"), err=$("#a-err"), go=$("#a-go");
  (up?$("#a-name"):$("#a-email")).focus();
  f.onsubmit=async ev=>{
    ev.preventDefault(); err.hidden=true;
    const name=up?$("#a-name").value.trim():"", email=$("#a-email").value.trim(), pass=$("#a-pass").value;
    if(up&&!name) return showErr("Enter your first name.");
    if(!/^\S+@\S+\.\S+$/.test(email)) return showErr("Enter a valid email address.");
    if(pass.length<6) return showErr("Use a password with at least 6 characters.");
    go.disabled=true; go.textContent=up?"Creating…":"Signing in…";
    try{
      if(up){ const r=await signUp(name,email,pass);
        if(r==="confirm"){ $("#sheet .sheet").innerHTML=`<div style="text-align:center">${mascot("wow")}<h2 class="sec" style="margin:4px 0">Check your email</h2><p class="sub">We sent a link to ${esc(email)}. Tap it, then come back and sign in.</p></div><button class="btn wide" id="a-after">Sign in</button>`; $("#a-after").onclick=()=>authSheet("in"); return; } }
      else await signIn(email,pass);
      $("#sheet").hidden=true; $("#sheet").innerHTML=""; sWin(); render();
    }catch(e){
      const m=/invalid login/i.test(e.message)?"Wrong email or password.":/already registered|already exists/i.test(e.message)?"That email already has an account. Sign in instead.":/email not confirmed/i.test(e.message)?"Confirm your email first. Check your inbox for the link.":/fetch|network/i.test(e.message)?"No connection. Check your internet and try again.":e.message;
      showErr(m); go.disabled=false; go.textContent=up?"Create account":"Sign in";
    }
  };
  function showErr(m){ err.textContent=m; err.hidden=false; }
}

/* ================= CONTENT CHECK (shared between reviewers) =================
   Cloud mode: only accounts listed in the Supabase "reviewers" table see it, and
   everyone on that list shares one set of checks. Local mode: saved on this device. */
let IS_REVIEWER=false, CHECKS={}, revFilter="todo", revKeep=new Set();
const canReview=()=>!CLOUD||IS_REVIEWER;
try{ const old=S.checked||{}; if(!S.reviews){ S.reviews={}; Object.keys(old).forEach(k=>{if(old[k])S.reviews[k]={status:"ok",note:""};}); } }catch(e){}
async function loadReviewer(){
  if(!CLOUD||!SES){ IS_REVIEWER=false; return; }
  try{ if(!(await freshToken())) return;
    const r=await api("/rest/v1/reviewers?select=email"); IS_REVIEWER=!!(r&&r.length);
    if(IS_REVIEWER){ const rows=await api("/rest/v1/phrase_checks?select=phrase,status,note,checked_by"); CHECKS={}; (rows||[]).forEach(x=>CHECKS[x.phrase]=x); }
  }catch(e){ IS_REVIEWER=false; }
}
const checksMap=()=>CLOUD?CHECKS:(S.reviews||(S.reviews={}));
function reviewCounts(){ const m=checksMap(), ks=Object.keys(W); const ok=ks.filter(k=>m[k]&&m[k].status==="ok").length, fix=ks.filter(k=>m[k]&&m[k].status==="fix").length; return {all:ks.length,ok,fix,todo:ks.length-ok-fix}; }
function reviewCard(){
  if(!canReview()) return "";
  const c=reviewCounts();
  return `<h2 class="sec">Content check</h2><div class="card stack"><div class="pbar"><i style="width:${c.ok/c.all*100}%;background:var(--good-btn)"></i><span>${c.ok} correct · ${c.fix} need a fix · ${c.todo} to check</span></div><p class="sub" style="margin:0">${CLOUD?"Shared with everyone on your reviewers list.":"Saved on this device."}</p><button class="btn wide" id="open-review">Check phrases</button></div>`;
}
async function saveCheck(k,status,note){
  const m=checksMap(), by=CLOUD&&SES?(SES.user.email||""):"";
  if(status===null){ delete m[k]; } else m[k]={phrase:k,status,note:note||"",checked_by:by};
  if(!CLOUD){ save(); return true; }
  try{ await freshToken();
    if(status===null) await api("/rest/v1/phrase_checks?phrase=eq."+encodeURIComponent(k),{method:"DELETE"});
    else await api("/rest/v1/phrase_checks",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({phrase:k,status,note:note||"",checked_by:by,updated_at:new Date().toISOString()})});
    return true;
  }catch(e){ toast("Couldn't save. Check your internet."); return false; }
}
function openReview(){ revKeep.clear(); $("#review").hidden=false; document.body.style.overflow="hidden"; drawReview(); }
function closeReview(){ $("#review").hidden=true; $("#review").innerHTML=""; document.body.style.overflow=""; render(); }
function drawReview(){
  const m=checksMap(), c=reviewCounts();
  const keys=Object.keys(W).filter(k=>{const st=m[k]&&m[k].status; return revKeep.has(k)||revFilter==="all"||(revFilter==="todo"&&!st)||st===revFilter;});
  const chip=(f,label,n)=>`<button class="rchip" data-f="${f}" aria-pressed="${revFilter===f}">${label} <b>${n}</b></button>`;
  $("#review").innerHTML=`<div class="l-in"><div class="l-head"><button class="x" id="rv-x" aria-label="Close">${I.x}</button><h2 class="sec" style="margin:0;flex:1">Content check</h2><button class="btn ghost blue" id="rv-copy" style="padding:8px 12px" ${c.fix?"":"disabled"}>Copy fixes</button></div>
  <div class="rchips">${chip("todo","To check",c.todo)}${chip("fix","Needs fix",c.fix)}${chip("ok","Correct",c.ok)}${chip("all","All",c.all)}</div>
  <div class="l-body" style="gap:10px">${keys.length?keys.map(k=>{const r=m[k]||{},w=W[k];return `<div class="card rv" data-k="${k}"><div class="rv-top">${lbtn(k)}<div style="min-width:0;flex:1"><span class="say" style="font-size:19px">${esc(w.tr)}</span><span class="arsm">${w.ar}</span><small style="display:block;color:var(--muted);font-weight:600">${esc(w.en)}</small></div></div>
    <div class="rv-btns"><button class="rbtn ok" data-s="ok" aria-pressed="${r.status==="ok"}">${I.ok}Correct</button><button class="rbtn fix" data-s="fix" aria-pressed="${r.status==="fix"}">Needs fix</button></div>
    ${r.status==="fix"?`<label class="fld" style="font-size:14px">How do people in Mosul say it?<input class="rv-note" value="${esc(r.note||"")}" placeholder="e.g. the right spelling, word or meaning" maxlength="300"></label>`:""}
    ${r.checked_by?`<small style="color:var(--muted);font-weight:600">Checked by ${esc(r.checked_by)}</small>`:""}</div>`;}).join(""):`<div class="end" style="flex:none;padding-block:40px">${mascot("happy")}<p class="sub">Nothing here.</p></div>`}</div></div>`;
  $("#rv-x").onclick=closeReview;
  document.querySelectorAll(".rchip").forEach(b=>b.onclick=()=>{revFilter=b.dataset.f;revKeep.clear();drawReview();});
  document.querySelectorAll(".rv").forEach(card=>{
    const k=card.dataset.k;
    card.querySelectorAll(".rbtn").forEach(b=>b.onclick=async()=>{const cur=m[k]&&m[k].status, st=b.dataset.s===cur?null:b.dataset.s; revKeep.add(k); await saveCheck(k,st,st==="fix"?((m[k]&&m[k].note)||""):""); sTap(); const y=$("#review .l-body").scrollTop; drawReview(); $("#review .l-body").scrollTop=y; if(st==="fix"){const inp=document.querySelector(`.rv[data-k="${k}"] .rv-note`); if(inp) inp.focus();}});
    const inp=card.querySelector(".rv-note");
    if(inp) inp.onchange=async()=>{ if(await saveCheck(k,"fix",inp.value.trim())) toast("Saved"); };
  });
  $("#rv-copy").onclick=()=>{
    const txt=Object.keys(W).filter(k=>m[k]&&m[k].status==="fix").map(k=>`- ${W[k].tr} (${W[k].en}): ${(m[k].note||"no note").trim()}`).join("\n");
    const done=()=>toast("Copied. Paste it to Claude to apply the fixes.");
    try{ navigator.clipboard.writeText("Maslawi fixes:\n"+txt).then(done,()=>sheet(`<h2 class="sec" style="margin:0">Fixes to send</h2><textarea class="type-in" readonly style="min-height:240px">${esc("Maslawi fixes:\n"+txt)}</textarea><button class="btn wide" data-close>Done</button>`)); }
    catch(e){ sheet(`<textarea class="type-in" readonly style="min-height:240px">${esc(txt)}</textarea><button class="btn wide" data-close>Done</button>`); }
  };
}

/* offline + install support when served from a website */
if("serviceWorker" in navigator && location.protocol==="https:" && !/claude|anthropic/.test(location.hostname)){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}

if(CLOUD&&SES) pullAndMerge();
setTab("learn");
